# .github/workflows/daily-top-repo.yml
#
# PURPOSE: Every day at 00:05 UTC, query the GitHub Search API for the single
# most-starred repository matching FDE-relevant topics (devops, kubernetes,
# deployment, terraform, etc.), write the result to _data/top_repo.json, and
# commit it.  The portfolio's hero section reads this file via fetch() at page
# load — so visitors always see today's #1 ranked repo automatically.
#
# PLACEMENT: sreenathgopal.github.io/.github/workflows/daily-top-repo.yml
#
# REQUIRED: No extra secrets needed — uses the built-in GITHUB_TOKEN.

name: Daily — Update #1 Ranked Repo

on:
  schedule:
    # 00:05 UTC daily — just after midnight so the date is always "today"
    - cron: '5 0 * * *'

  # Allow manual trigger from the Actions tab for testing
  workflow_dispatch:
    inputs:
      query:
        description: 'Custom GitHub search query (optional)'
        required: false
        default: ''

permissions:
  contents: write   # needed to commit _data/top_repo.json

jobs:
  fetch-top-repo:
    name: Fetch #1 Starred Repo & Commit
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the Pages repo ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Fetch #1 repo via GitHub Search API ───────────────────────────────
      - name: Query GitHub Search API
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_QUERY: ${{ github.event.inputs.query }}
        run: |
          # Use custom query if provided, otherwise use default FDE topic query
          if [ -n "$CUSTOM_QUERY" ]; then
            QUERY="$CUSTOM_QUERY"
          else
            QUERY="devops OR kubernetes OR deployment OR terraform OR ansible OR mlops"
          fi

          echo "🔍 Searching GitHub for: $QUERY"

          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/search/repositories?q=${QUERY// /+}+license:mit&sort=stars&order=desc&per_page=1")

          if [ -z "$RESPONSE" ]; then
            echo "::error::GitHub API returned empty response"
            exit 1
          fi

          # Parse response with Python (always available on ubuntu-latest)
          python3 << 'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone

          raw = os.popen('echo "$RESPONSE"').read()

          # Read env var directly
          import subprocess
          result = subprocess.run(
            ['bash', '-c', 'echo "$RESPONSE"'],
            capture_output=True, text=True,
            env={**os.environ}
          )
          data = json.loads(result.stdout.strip())

          items = data.get("items", [])
          if not items:
              print("::error::No repositories found", file=sys.stderr)
              sys.exit(1)

          repo = items[0]
          today = datetime.now(timezone.utc)

          output = {
              "name":        repo["full_name"],
              "description": repo.get("description") or "No description available",
              "stars":       repo["stargazers_count"],
              "url":         repo["html_url"],
              "language":    repo.get("language") or "Various",
              "topics":      repo.get("topics", [])[:4],
              "updated_at":  repo.get("updated_at", today.isoformat()),
              "fetched_date": today.strftime("%Y-%m-%d"),
              "fetched_at":   today.isoformat(),
          }

          os.makedirs("_data", exist_ok=True)
          with open("_data/top_repo.json", "w") as f:
              json.dump(output, f, indent=2)

          print(f"✅ #1 repo: {output['name']} ({output['stars']:,} ⭐)")
          print(f"   {output['description']}")
          print(f"   {output['url']}")
          PYEOF

      # ── 3. Show what we found (visible in Actions log) ───────────────────────
      - name: Display result
        run: |
          echo "📦 _data/top_repo.json contents:"
          cat _data/top_repo.json

      # ── 4. Commit & push if the file changed ─────────────────────────────────
      - name: Commit updated top_repo.json
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add _data/top_repo.json

          # Only commit if there's actually a change
          if git diff --staged --quiet; then
            echo "ℹ️  No change in top repo data — skipping commit"
          else
            REPO_NAME=$(python3 -c "import json; d=json.load(open('_data/top_repo.json')); print(d['name'])")
            STARS=$(python3 -c "import json; d=json.load(open('_data/top_repo.json')); print(f\"{d['stars']:,}\")")
            git commit -m "data: today's #1 repo → ${REPO_NAME} (⭐${STARS}) [skip ci]"
            git push
            echo "✅ Committed and pushed"
          fi

      # ── 5. Write a summary to the Actions UI ─────────────────────────────────
      - name: Job summary
        if: always()
        run: |
          if [ -f "_data/top_repo.json" ]; then
            NAME=$(python3 -c "import json; d=json.load(open('_data/top_repo.json')); print(d['name'])")
            STARS=$(python3 -c "import json; d=json.load(open('_data/top_repo.json')); print(f\"{d['stars']:,}\")")
            URL=$(python3 -c "import json; d=json.load(open('_data/top_repo.json')); print(d['url'])")
            DESC=$(python3 -c "import json; d=json.load(open('_data/top_repo.json')); print(d['description'])")
            DATE=$(python3 -c "import json; d=json.load(open('_data/top_repo.json')); print(d['fetched_date'])")

            cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🏆 Today's #1 Ranked GitHub Repo

          | Field | Value |
          |-------|-------|
          | **Repository** | [$NAME]($URL) |
          | **Stars** | ⭐ $STARS |
          | **Description** | $DESC |
          | **Fetched** | $DATE |

          The hero section at [sreenathgopal.github.io](https://sreenathgopal.github.io) now shows this repo.
          EOF
          else
            echo "⚠️ top_repo.json was not created — check the fetch step above" >> $GITHUB_STEP_SUMMARY
          fi
