# .github/workflows/daily-top-repo.yml
#
# Runs every day at 00:05 UTC.
# Fetches the top 4 most-starred FDE-relevant repos from GitHub Search API,
# writes them to _data/top_repo.json (with fetched_date), and commits.
# The portfolio hero section reads this file and renders the 4-tile grid + date badge.

name: Daily — Update Top 4 Ranked Repos

on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC every day
  workflow_dispatch:
    inputs:
      query:
        description: 'Custom GitHub search query (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch-top-repos:
    name: Fetch Top 4 Repos & Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Query GitHub Search API — top 4 repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_QUERY: ${{ github.event.inputs.query }}
        run: |
          QUERY="${CUSTOM_QUERY:-devops OR kubernetes OR deployment OR terraform OR ansible OR mlops}"
          echo "🔍 Query: $QUERY"

          python3 << 'PYEOF'
          import json, os, subprocess
          from datetime import datetime, timezone

          query  = os.environ.get("CUSTOM_QUERY") or \
                   "devops OR kubernetes OR deployment OR terraform OR ansible OR mlops"
          token  = os.environ["GH_TOKEN"]
          q_enc  = query.replace(" ", "+")

          result = subprocess.run([
            "curl", "-sf",
            "-H", f"Authorization: Bearer {token}",
            "-H", "Accept: application/vnd.github+json",
            "-H", "X-GitHub-Api-Version: 2022-11-28",
            f"https://api.github.com/search/repositories?q={q_enc}+license:mit&sort=stars&order=desc&per_page=4"
          ], capture_output=True, text=True)

          data  = json.loads(result.stdout)
          items = data.get("items", [])
          if not items:
              raise SystemExit("❌ No repositories returned from GitHub API")

          now   = datetime.now(timezone.utc)
          repos = []
          for i, r in enumerate(items[:4]):
              repos.append({
                  "rank":        i + 1,
                  "name":        r["full_name"],
                  "description": r.get("description") or "No description available",
                  "stars":       r["stargazers_count"],
                  "url":         r["html_url"],
                  "language":    r.get("language") or "Various",
                  "topics":      r.get("topics", [])[:3],
              })
              print(f"  #{i+1}  {r['full_name']}  ⭐{r['stargazers_count']:,}")

          output = {
              "fetched_date": now.strftime("%Y-%m-%d"),
              "fetched_at":   now.isoformat(),
              "query":        query,
              "repos":        repos,
          }

          os.makedirs("_data", exist_ok=True)
          with open("_data/top_repo.json", "w") as f:
              json.dump(output, f, indent=2)

          print(f"\n✅ Written _data/top_repo.json  ({len(repos)} repos,  date={output['fetched_date']})")
          PYEOF

      - name: Show result
        run: |
          echo "📦 _data/top_repo.json:"
          cat _data/top_repo.json

      - name: Commit & push
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"
          git add _data/top_repo.json
          if git diff --staged --quiet; then
            echo "ℹ️  No change — skipping commit"
          else
            DATE=$(python3 -c "import json; print(json.load(open('_data/top_repo.json'))['fetched_date'])")
            TOP=$(python3  -c "import json; print(json.load(open('_data/top_repo.json'))['repos'][0]['name'])")
            git commit -m "data(${DATE}): top repo → ${TOP} [skip ci]"
            git push
            echo "✅ Pushed"
          fi

      - name: Actions summary
        if: always()
        run: |
          if [ ! -f "_data/top_repo.json" ]; then
            echo "⚠️ top_repo.json was not created" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          DATE=$(python3 -c "import json; print(json.load(open('_data/top_repo.json'))['fetched_date'])")
          python3 << 'PYEOF'
          import json
          d = json.load(open("_data/top_repo.json"))
          lines = [
            f"## 🔥 Trending Repos — {d['fetched_date']}\n",
            "| Rank | Repository | Stars | Language |",
            "|------|-----------|-------|----------|",
          ]
          for r in d["repos"]:
              lines.append(f"| #{r['rank']} | [{r['name']}]({r['url']}) | ⭐ {r['stars']:,} | {r['language']} |")
          lines.append(f"\nHero section at [sreenathgopal.github.io](https://sreenathgopal.github.io) updated.")
          print("\n".join(lines))
          PYEOF
          python3 -c "
          import json
          d = json.load(open('_data/top_repo.json'))
          lines = [
            '## 🔥 Trending Repos — ' + d['fetched_date'],
            '',
            '| Rank | Repository | Stars | Language |',
            '|------|-----------|-------|----------|',
          ]
          for r in d['repos']:
              lines.append(f\"| #{r['rank']} | [{r['name']}]({r['url']}) | ⭐ {r['stars']:,} | {r['language']} |\")
          lines.append('')
          lines.append('Hero section at [sreenathgopal.github.io](https://sreenathgopal.github.io) now shows these repos.')
          print('\n'.join(lines))
          " >> $GITHUB_STEP_SUMMARY
